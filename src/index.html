<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Apex Performance</title>
    <base href="/" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <link rel="preconnect" href="https://primefaces.org" />
    <link href="https://fonts.cdnfonts.com/css/lato" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <link rel="shortcut icon" href="assets/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Apex" />
    <link rel="manifest" href="assets/icons/site.webmanifest" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SG4V1CW8PK"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());

        gtag('config', 'G-SG4V1CW8PK');
    </script>
    <!-- Heading font (Michroma, Eurostile Bold Extended style) -->
    <link rel="stylesheet" href="assets/fonts/michroma/michroma.css" />
    <!-- Intro of the Apex Performance app (splash.mp4 from iOS and Android), once per visit. -->
    <style>
        #splash {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: grid;
            place-items: center;
            background: #090b0d;
            transition: opacity 0.35s ease-out;
        }
        #splash.hide {
            opacity: 0;
            pointer-events: none;
        }
        #splash video {
            width: min(72vw, 380px);
            aspect-ratio: 1;
        }
    </style>
</head>

<body>
<div id="splash" aria-hidden="true">
    <video src="assets/video/splash.mp4" muted playsinline preload="auto"></video>
</div>
<script>
    (function () {
        var splash = document.getElementById('splash');
        var video = splash.querySelector('video');
        var seen = false;
        try {
            seen = sessionStorage.getItem('apex-splash') === '1';
            sessionStorage.setItem('apex-splash', '1');
        } catch (e) {}

        var done = false;
        function finish() {
            if (done) return;
            done = true;
            video.pause();
            splash.classList.add('hide');
            setTimeout(function () { splash.remove(); }, 400);
        }

        // Shown once per visit, never to users who turned animations off.
        if (seen || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            splash.remove();
            return;
        }

        video.addEventListener('ended', finish);
        video.addEventListener('error', finish);
        // Longest the splash may stay when the video doesn't play.
        setTimeout(finish, 4000);
        var playing = video.play();
        if (playing && playing.catch) playing.catch(finish);
    })();
</script>
<app-root></app-root>
<script>
    // iOS Safari ignores user-scalable=no, pinch zoom is blocked here.
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('touchmove', function (e) {
        if (e.touches && e.touches.length > 1) e.preventDefault();
    }, { passive: false });
</script>
</body>
</html>
