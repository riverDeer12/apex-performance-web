<div class="flex flex-col">
    <div class="card">
        <div class="font-semibold text-xl mb-2">Shopping Cart Items ({{ shoppingCartItems.length }})
            <p-button *ngIf="shoppingCartItems.length" icon="pi pi-trash" [rounded]="true" [text]="true"
                      label="Empty Shopping Cart"
                      (click)="clearShoppingCart()" severity="danger"
                      styleClass="flex-auto md:flex-initial whitespace-nowrap"></p-button>
        </div>
        <p-dataview [value]="shoppingCartItems" layout="list">
            <ng-template #list let-items>
                <div class="flex flex-col">
                    <div *ngFor="let item of items; let i = index">
                        <div class="flex flex-col sm:flex-row sm:items-center p-6 gap-4"
                             [ngClass]="{ 'border-t border-surface': i !== 0 }">
                            <div class="md:w-40 relative">
                                <img class="block xl:block mx-auto rounded w-full"
                                     src="https://primefaces.org/cdn/primevue/images/product/{{ item.image }}"
                                     [alt]="item.name" />
                            </div>
                            <div class="flex flex-col md:flex-row justify-between md:items-center flex-1 gap-6">
                                <div class="flex flex-row md:flex-col justify-between items-start gap-2">
                                    <div>
                                        <div class="text-lg font-medium mt-2">{{ item.name }}</div>
                                    </div>
                                    <div class="bg-surface-100 p-1" style="border-radius: 30px">
                                        <div
                                            class="bg-surface-0 flex items-center gap-2 justify-center py-1 px-2"
                                            style="
                                                    border-radius: 30px;
                                                    box-shadow:
                                                        0px 1px 2px 0px rgba(0, 0, 0, 0.04),
                                                        0px 1px 2px 0px rgba(0, 0, 0, 0.06);
                                                "
                                        >
                                            <p-button icon="pi pi-minus" [rounded]="true" [text]="true"
                                                      (click)="removeShoppingCartItemQuantity(item)"
                                                      styleClass="flex-auto md:flex-initial whitespace-nowrap"></p-button>
                                            ({{ item.quantity }})
                                            <p-button icon="pi pi-plus" [rounded]="true" [text]="true"
                                                      (click)="updateShoppingCartItemQuantity(item)"
                                                      styleClass="flex-auto md:flex-initial whitespace-nowrap"></p-button>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex flex-col md:items-end gap-8">
                                    <span
                                        class="text-xl font-semibold">{{ item.price * item.quantity | number:'1.2-2' }}
                                        €</span>
                                    <div class="flex flex-row-reverse md:flex-row gap-2">
                                        <p-button severity="danger" icon="pi pi-trash" [rounded]="true" [text]="true"
                                                  (click)="removeShoppingCartItem(item)"
                                                  styleClass="flex-auto md:flex-initial whitespace-nowrap"></p-button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </ng-template>
        </p-dataview>
        <div class="font-semibold text-xl mb-2 float-end">
            <p-button *ngIf="shoppingCartItems.length" icon="pi pi-shopping-bag" [rounded]="true" [text]="true"
                      label="Go To Checkout"
                      styleClass="flex-auto md:flex-initial whitespace-nowrap"
                      (click)="goToCheckout()"></p-button>
        </div>
    </div>
</div>
