<p-dataview [value]="products" layout="grid">
    <ng-template #grid let-products>
        <div class="grid grid-cols-12 gap-4">
            <div *ngFor="let product of products; let i = index" class="col-span-12 sm:col-span-6 lg:col-span-4 p-2">
                <div
                    class="p-6 border border-surface-200 dark:border-surface-700 bg-surface-0 dark:bg-surface-900 rounded flex flex-col">
                    <div class="relative w-full shadow-sm">
                        <img class="rounded w-full"
                             src="assets/images/{{product.image}}"
                             [alt]="product.name" />
                        <div
                            class="absolute bg-black/70 rounded-border"
                            [style]="{
                                            left: '4px',
                                            top: '4px'
                                        }"
                        >
                        </div>
                    </div>
                    <div class="pt-12">
                        <div class="flex flex-row justify-between items-start gap-2">
                            <div>
                                    <span
                                        class="font-medium text-surface-500 dark:text-surface-400 text-sm">{{ product.category }}</span>
                                <div class="text-lg font-medium mt-1">
                                    {{ product.name }}
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-col gap-6 mt-6">
                            <span class="text-2xl font-semibold">{{ product.price | number:'1.2-2' }} €</span>
                            <div class="flex gap-2">
                                <p-button icon="pi pi-shopping-cart" label="Add To Cart"
                                          (click)="addProductToShoppingCart(product)"
                                          class="flex-auto whitespace-nowrap" styleClass="w-full"></p-button>
                                <p-button icon="pi pi-heart" styleClass="h-full" [outlined]="true"></p-button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </ng-template>
</p-dataview>
