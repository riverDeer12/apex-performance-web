<form [formGroup]="form" (submit)="submit()">
    <div class="formgrid grid">
        <div class="field col-12 xl:col-6 lg:col-6 md:col-6">
            <label for="name">{{ "common.name" | translate }}</label>
            <input
                class="w-full {{validationService.getInputClass(form, 'name', 'required')}}"
                type="text" id="name" pInputText formControlName="name"/>
            <small class="p-error"
                   *ngIf="validationService.hasErrors(form, 'username', 'required')"
                   id="name-input">{{ "common.required" | translate }}</small>
        </div>
    </div>
    <div class="my-3">
        <p-button type="submit" iconPos="right" icon="pi pi-save" [label]="'common.save' | translate" />
    </div>
</form>
