<div class="my-3">
    <p-button (click)="openCreateDialog()" *ngIf="userCanCreateRecurringAppointment"
              type="button" iconPos="right" icon="pi pi-plus" label="New Recurring Appointment" />
</div>

<p-table
    [value]="recurringAppointments"
    showGridlines
    [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template #header>
        <tr>
            <th>Client</th>
            <th>Coach</th>
            <th>Day</th>
            <th>Start Time</th>
            <th>End Time</th>
        </tr>
    </ng-template>
    <ng-template #body let-recurringAppointment>
        <tr>
            <td>{{ recurringAppointment.client.fullName }}</td>
            <td>{{ recurringAppointment.coach.fullName }}</td>
            <td>{{ recurringAppointment.day }}</td>
            <td>{{ recurringAppointment.startTime | date : 'dd.MM.yyyy. HH:mm:ss' }}</td>
            <td>{{ recurringAppointment.endTime | date : 'dd.MM.yyyy. HH:mm:ss' }}</td>
        </tr>
    </ng-template>
</p-table>
