<form [formGroup]="form" (submit)="submit()">
    <div class="formgrid grid">
        <div *ngIf="userRole != userRoles.Coach" class="field col-12 xl:col-6 lg:col-6 md:col-6">
            <label for="clients">{{ "common.coaches" | translate }}</label>
            <p-multi-select [filter]="true" [options]="coaches"
                            appendTo="body" styleClass="w-full"
                            formControlName="coaches" optionLabel="fullName" optionValue="id"
                            id="coaches" />
            <small class="p-error"
                   *ngIf="validationService.hasErrors(form, 'coaches', 'required')"
                   id="coaches-input">{{ "common.required" | translate }}</small>
        </div>
        <div class="field col-12 xl:col-6 lg:col-6 md:col-6">
            <label>{{ "common.day" | translate }}</label>
            <p-datepicker appendTo="body" id="day"
                          dateFormat="dd.mm.yy"
                          styleClass="w-full"
                          formControlName="day"
                          [dataType]="'string'"
                          (onSelect)="getDataForSelectedCoaches()"
                          [firstDayOfWeek]="1"
                          [minDate]="minDate"
                          [disabledDays]="[0]"></p-datepicker>
            <small class="p-error"
                   *ngIf="validationService.hasErrors(form, 'day', 'required')"
                   id="day-input">{{ "common.required" | translate }}</small>
        </div>
        <div class="field col-12 xl:col-6 lg:col-6 md:col-6">
            <label for="timeSlot">{{ "common.timeSlot" | translate }}</label>
            <p-select id="timeSlot" styleClass="w-full" [options]="timeSlots"
                      formControlName="timeSlot"
                      optionLabel="name" optionValue="id" />
            <small class="p-error"
                   *ngIf="validationService.hasErrors(form, 'timeSlot', 'required')"
                   id="startTime-input">{{ "common.required" | translate }}</small>
        </div>
        <div class="field col-12 xl:col-6 lg:col-6 md:col-6">
            <label for="type">{{ "common.type" | translate }}</label>
            <p-select [filter]="true" [options]="appointmentTypes"
                      appendTo="body" styleClass="w-full"
                      formControlName="type" optionLabel="name" optionValue="id"
                      id="type" />
            <small class="p-error"
                   *ngIf="validationService.hasErrors(form, 'type', 'required')"
                   id="appointmentType-input">{{ "common.required" | translate }}</small>
        </div>
    </div>
    <div class="field col-12 xl:col-6 lg:col-6 md:col-6" *ngIf="userRole !== userRoles.Client">
        <label for="clients">{{ "common.clients" | translate }}</label>
        <p-multi-select
            [options]="clients"
            optionLabel="fullName"
            optionValue="id"
            [filter]="true"
            appendTo="body"
            styleClass="w-full"
            formControlName="clients"
            id="clients" />
        <small class="p-error"
               *ngIf="validationService.hasErrors(form, 'clients', 'required')"
               id="clients-input">{{ "common.required" | translate }}</small>
    </div>
    <div class="my-3">
        <p-button
            type="submit"
            [disabled]="loadingData"
            [icon]="loadingData ? 'pi pi-spin pi-spinner' : 'pi pi-save'"
            [label]="loadingData ? ('common.saving' | translate) : ('common.save' | translate)">
        </p-button>
    </div>
</form>
