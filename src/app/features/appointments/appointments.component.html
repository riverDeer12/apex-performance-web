<div class="my-3">
    <p-button (click)="openCreateDialog()"
              type="button" iconPos="right" icon="pi pi-plus" label="New Appointment" />
</div>

<div *ngFor="let day of appointmentsByDay">
    <h4 style="margin-top: 3rem">{{day.day | date : 'dd.MM.yyyy' }}</h4>

    <hr>

    <p-timeline [value]="day.appointments">
        <ng-template #marker let-appointment>
        <span class="flex w-8 h-8 items-center justify-center rounded-full z-10 shadow-sm">
            <img height="35" [src]="'assets/icons/'+ appointment.appointmentType.description + '.png'" alt="">
        </span>
        </ng-template>
        <ng-template #opposite let-appointment>
            <p-button size="small" (click)="openUpdateDialog(appointment)"
                      type="button" class="mr-3" iconPos="right" icon="pi pi-pencil" label="" />
            <span
                class="text-surface-500 dark:text-surface-400">{{ appointment.startTime | date : 'HH:mm' }}</span>

        </ng-template>
        <ng-template #content let-appointment>
        <span *ngFor="let client of appointment.clients">
            {{ client.firstname }} {{ client.lastname }} <br>
        </span>
            <span><i>{{ appointment.appointmentType.name }}</i></span>
        </ng-template>
    </p-timeline>
</div>
