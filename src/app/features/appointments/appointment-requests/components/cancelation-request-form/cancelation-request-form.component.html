<form [formGroup]="form" (submit)="submit()">
    <div class="formgrid grid">
        <div class="field col-12 xl:col-6 lg:col-6 md:col-6">
            <textarea id="comment"
                      placeholder="{{ 'appointmentRequests.explanationPlaceholder' | translate }}"
                      pInputText
                      rows="5" cols="30"
                      class="w-full {{validationService.getInputClass(form, 'comment', 'required')}}"
                      formControlName="comment"></textarea>
            <small class="p-error"
                   *ngIf="validationService.hasErrors(form, 'comment', 'required')"
                   id="name-input">{{ "common.required" | translate }}</small>
        </div>
    </div>
    <div class="my-3">
        <p-button
  type="submit"
  [disabled]="loadingData"
  [icon]="loadingData ? 'pi pi-spin pi-spinner' : 'pi pi-save'"
  [label]="loadingData ? ('common.saving' | translate) : ('common.save' | translate)">
</p-button>
    </div>
</form>
