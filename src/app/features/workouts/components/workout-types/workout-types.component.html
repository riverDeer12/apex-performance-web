<p-table #table [value]="rows" dataKey="id" [loading]="loading" [rows]="10" [paginator]="rows.length > 10"
         [rowHover]="true" [showGridlines]="true" responsiveLayout="scroll" [globalFilterFields]="['name']"
         sortField="name" [showCurrentPageReport]="true"
         [currentPageReportTemplate]="'common.entriesTemplate' | translate">
    <ng-template #caption>
        <div class="flex justify-between items-center flex-wrap gap-2">
            <div class="flex items-center gap-3 flex-wrap">
                <p-button *ngIf="canDelete" icon="pi pi-plus" iconPos="right" [label]="'workoutTypes.new' | translate"
                          (click)="openCreate()" />
                <span class="text-sm text-muted-color">{{ "workoutTypes.hint" | translate }}</span>
            </div>
            <p-iconfield iconPosition="left">
                <p-inputicon><i class="pi pi-search"></i></p-inputicon>
                <input pInputText type="text" (input)="table.filterGlobal($any($event.target).value, 'contains')"
                       [placeholder]="'workoutTypes.search' | translate" />
            </p-iconfield>
        </div>
    </ng-template>
    <ng-template #header>
        <tr>
            <th pSortableColumn="name">
                {{ "common.name" | translate }} <p-sortIcon field="name" />
            </th>
            <th pSortableColumn="workoutsCount" style="width: 12rem">
                {{ "workoutTypes.workoutsCount" | translate }} <p-sortIcon field="workoutsCount" />
            </th>
            <th *ngIf="canDelete" style="width: 8rem"></th>
        </tr>
    </ng-template>
    <ng-template #body let-row>
        <tr>
            <td class="font-semibold">{{ row.name }}</td>
            <td>
                <span [class.text-muted-color]="row.workoutsCount === 0">{{ row.workoutsCount }}</span>
            </td>
            <td *ngIf="canDelete">
                <div class="flex gap-2">
                    <p-button icon="pi pi-pencil" severity="secondary" [outlined]="true" (click)="openEdit(row)"
                              [ariaLabel]="'workoutTypes.edit' | translate" />
                    <p-button icon="pi pi-trash" severity="danger" [outlined]="true" (click)="confirmDelete(row)"
                              [ariaLabel]="'workoutTypes.delete' | translate" />
                </div>
            </td>
        </tr>
    </ng-template>
    <ng-template #emptymessage>
        <tr><td [attr.colspan]="canDelete ? 3 : 2">{{ "workoutTypes.noneFound" | translate }}</td></tr>
    </ng-template>
</p-table>

<p-dialog [(visible)]="editVisible" [modal]="true" [dismissableMask]="true" [style]="{ width: '30rem' }"
          [breakpoints]="{ '640px': '95vw' }" [header]="(editRow ? 'workoutTypes.edit' : 'workoutTypes.new') | translate">
    <form class="flex flex-col gap-4" (ngSubmit)="saveEdit()">
        <div class="flex flex-col gap-2">
            <label for="typeNameHr">{{ "workouts.nameHr" | translate }}</label>
            <input pInputText id="typeNameHr" name="nameHr" [(ngModel)]="editNameHr" maxlength="200" required />
            <small *ngIf="!editNameHr.trim()" class="p-error">{{ "common.required" | translate }}</small>
        </div>
        <div class="flex flex-col gap-2">
            <label for="typeNameEn">{{ "workouts.nameEn" | translate }}</label>
            <input pInputText id="typeNameEn" name="nameEn" [(ngModel)]="editNameEn" maxlength="200" />
        </div>
        <p *ngIf="editRow?.workoutsCount" class="text-sm text-muted-color m-0">
            {{ "workoutTypes.renameHint" | translate }}</p>
        <div>
            <p-button type="submit" icon="pi pi-save" [label]="'common.save' | translate"
                      [disabled]="!editNameHr.trim() || saving" [loading]="saving" />
        </div>
    </form>
</p-dialog>
