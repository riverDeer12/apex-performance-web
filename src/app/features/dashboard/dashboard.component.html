
<h4>Appointments</h4>

<app-appointments-list [appointments]="approvedAppointments" type="Approved"></app-appointments-list>

<app-appointments-list [appointments]="pendingAppointments" type="Pending"></app-appointments-list>

<app-appointments-list [appointments]="inProgressAppointments" type="In Progress"></app-appointments-list>

<div *ngIf="showAppointmentRequests">

    <app-appointments-requests-list [appointmentRequests]="appointmentRequests"></app-appointments-requests-list>
</div>
