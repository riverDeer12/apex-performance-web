<div class="my-3">
    <p-button (click)="openCreateDialog()"
              type="button" iconPos="right" icon="pi pi-plus" label="New Client"/>
</div>

<p-table
    #clientsTable
    [value]="clients"
    dataKey="id"
    sortField="updatedAt"
    [sortOrder]="-1"
    [rows]="10"
    [rowHover]="true"
    [showGridlines]="true"
    [paginator]="true"
    [globalFilterFields]="['firstName', 'lastName']"
    responsiveLayout="scroll"
    showCurrentPageReport="true"
    currentPageReportTemplate="There are {totalRecords} entries"
>
    <ng-template>
        <div class="flex justify-between items-center flex-column sm:flex-row">
            <button pButton label="Clear" class="p-button-outlined mb-2" icon="pi pi-filter-slash"
                    (click)="clear(clientsTable)"></button>
            <p-iconfield iconPosition="left" class="ml-auto">
                <p-inputicon>
                    <i class="pi pi-search"></i>
                </p-inputicon>
                <input pInputText type="text" (input)="onGlobalFilter(clientsTable, $event)"
                />
            </p-iconfield>
        </div>
    </ng-template>
    <ng-template #header>
        <tr>
            <th pSortableColumn="fullName" style="min-width: 12rem">
                <div class="flex justify-between items-center">
                    Name
                    <p-sortIcon field="fullName"/>
                    <p-columnFilter type="text" field="fullName" display="menu" class="ml-auto"/>
                </div>
            </th>
            <th pSortableColumn="credits" style="min-width: 12rem">
                Credits
                <p-sortIcon field="credits"/>
            </th>
            <th pSortableColumn="lastCreditsIncrease" style="min-width: 12rem">
                Last Credits Increase
                <p-sortIcon field="lastCreditsMove File…"/>
            </th>
            <th pSortableColumn="status" style="min-width: 12rem">
                Status
                <p-sortIcon field="status"/>
            </th>
            <th style="width: 11rem"></th>
        </tr>
    </ng-template>
    <ng-template #body let-client>
        <tr [style]="{ 'background-color': client.credits <= 0 ? '#f8d7dacc' : '' }">
            <td>
                {{ client.fullName }}
            </td>
            <td>
                {{ client.credits }}
            </td>
            <td>
                {{ client.lastCreditsIncrease | date : 'dd.MM.yyyy.' }}
            </td>
            <td>
                {{ client.status }}
            </td>
            <td class="flex">
                <p-button (click)="openInfoDialog(client)" class="mr-2" icon="pi pi-info-circle" severity="secondary"
                          [outlined]="true"/>
                <p-button (click)="openUpdateDialog(client)" class="mr-2" icon="pi pi-pencil"
                          severity="secondary"
                          [outlined]="true"/>
                <p-button (click)="confirmDelete(client)" icon="pi pi-trash" severity="danger"
                          [outlined]="true"/>
            </td>
        </tr>
    </ng-template>
    <ng-template #emptymessage>
        <tr>
            <td colspan="8">No clients found.</td>
        </tr>
    </ng-template>
    <ng-template #loadingbody>
        <tr>
            <td colspan="8">Loading clients data. Please wait...</td>
        </tr>
    </ng-template>
</p-table>
