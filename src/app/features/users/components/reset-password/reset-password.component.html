<app-floating-configurator />
<div
        class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-[100vw] overflow-hidden">
    <div class="flex flex-col items-center justify-center">
        <div>
            <div class="w-full py-20 px-8 sm:px-20" style="border-radius: 53px">
                <div class="text-center mb-8">
                    <img class="login-header-image" src="../../../../../assets/images/logo_transparent.png" alt="">
                </div>
                <form [formGroup]="form" (submit)="submit()">
                    <div>
                        <label for="newPassword"
                               class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">New Password</label>
                        <p-password id="newPassword" formControlName="newPassword" [toggleMask]="true"
                                    styleClass="mb-4"
                                    [fluid]="true" [feedback]="false"></p-password>

                        <label for="confirmPassword"
                               class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2">Confirm Password</label>
                        <p-password id="confirmPassword" formControlName="confirmPassword" [toggleMask]="true"
                                    styleClass="mb-4"
                                    [fluid]="true" [feedback]="false"></p-password>

                        <p-button type="submit" label="Sign In" styleClass="w-full"></p-button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
