<form [formGroup]="form" (submit)="submit()">
    <div class="grid grid-cols-12 gap-4">
        <div class="col-span-12 md:col-span-6 flex flex-col gap-2">
            <label for="client">{{ "trainings.client" | translate }}</label>
            <p-select [filter]="true" [options]="clients" appendTo="body" styleClass="w-full"
                      formControlName="client" optionLabel="fullName" optionValue="id" inputId="client" />
            <small class="p-error" *ngIf="validationService.hasErrors(form, 'client', 'required')">
                {{ "common.required" | translate }}</small>
        </div>
        <div class="col-span-12 md:col-span-6 flex flex-col gap-2">
            <label for="date">{{ "trainings.date" | translate }}</label>
            <p-datepicker formControlName="date" dateFormat="dd.mm.yy" appendTo="body" styleClass="w-full"
                          inputId="date" [showIcon]="true" />
            <small class="p-error" *ngIf="validationService.hasErrors(form, 'date', 'required')">
                {{ "common.required" | translate }}</small>
        </div>
        <div class="col-span-12 md:col-span-8 flex flex-col gap-2">
            <label for="name">{{ "trainings.name" | translate }}</label>
            <input pInputText id="name" formControlName="name" class="w-full"
                   [placeholder]="'trainings.namePlaceholder' | translate" />
            <small class="p-error" *ngIf="validationService.hasErrors(form, 'name', 'required')">
                {{ "common.required" | translate }}</small>
        </div>
        <div class="col-span-12 md:col-span-4 flex items-center gap-2 md:pt-7">
            <p-checkbox formControlName="isCompleted" [binary]="true" inputId="isCompleted" />
            <label for="isCompleted">{{ "trainings.completed" | translate }}</label>
        </div>
        <div class="col-span-12 flex flex-col gap-2">
            <label for="note">{{ "trainings.note" | translate }}</label>
            <textarea pTextarea id="note" formControlName="note" rows="2" class="w-full"></textarea>
        </div>
    </div>

    <h6 class="mt-6 mb-3">{{ "trainings.exercises" | translate }}</h6>

    <div formArrayName="exercises" class="flex flex-col gap-3">
        <div *ngFor="let exercise of exercises.controls; let i = index" [formGroupName]="i"
             class="training-exercise grid grid-cols-12 gap-2 items-start p-3 rounded border border-surface">
            <div class="col-span-12 md:col-span-3 flex flex-col gap-1">
                <label class="text-sm">{{ i + 1 }}. {{ "trainings.exercise" | translate }}</label>
                <p-select [filter]="true" [options]="workoutOptions" optionLabel="label" optionValue="value"
                          appendTo="body" styleClass="w-full" formControlName="workout"
                          [placeholder]="'trainings.selectExercise' | translate" />
                <small class="p-error" *ngIf="exerciseHasError(i, 'workout', 'required')">
                    {{ "common.required" | translate }}</small>
            </div>
            <div class="col-span-4 md:col-span-1 flex flex-col gap-1">
                <label class="text-sm">{{ "trainings.sets" | translate }}</label>
                <input pInputText type="number" min="1" formControlName="sets" class="w-full" />
            </div>
            <div class="col-span-4 md:col-span-2 flex flex-col gap-1">
                <label class="text-sm">{{ "trainings.reps" | translate }}</label>
                <input pInputText formControlName="reps" class="w-full" placeholder="8-12" />
            </div>
            <div class="col-span-4 md:col-span-1 flex flex-col gap-1">
                <label class="text-sm">{{ "trainings.weight" | translate }}</label>
                <input pInputText type="number" min="0" step="0.5" formControlName="weight" class="w-full" />
            </div>
            <div class="col-span-12 md:col-span-3 flex flex-col gap-1">
                <label class="text-sm">{{ "trainings.note" | translate }}</label>
                <input pInputText formControlName="note" class="w-full" />
            </div>
            <div class="col-span-12 md:col-span-2 flex gap-1 md:pt-6 justify-end">
                <p-button type="button" icon="pi pi-arrow-up" severity="secondary" [text]="true" size="small"
                          [disabled]="i === 0" (click)="moveExercise(i, -1)" />
                <p-button type="button" icon="pi pi-arrow-down" severity="secondary" [text]="true" size="small"
                          [disabled]="i === exercises.length - 1" (click)="moveExercise(i, 1)" />
                <p-button type="button" icon="pi pi-trash" severity="danger" [text]="true" size="small"
                          (click)="removeExercise(i)" />
            </div>
        </div>
        <p *ngIf="exercises.length === 0" class="text-muted-color m-0">{{ "trainings.noExercisesYet" | translate }}</p>
    </div>

    <div class="mt-3">
        <p-button type="button" icon="pi pi-plus" severity="secondary" [outlined]="true"
                  [label]="'trainings.addExercise' | translate" (click)="addExercise()" />
    </div>

    <div class="my-4">
        <p-button type="submit" [disabled]="loadingData"
                  [icon]="loadingData ? 'pi pi-spin pi-spinner' : 'pi pi-save'"
                  [label]="loadingData ? ('common.saving' | translate) : ('common.save' | translate)" />
    </div>
</form>
