<app-floating-configurator />
<div
    class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-[100vw] overflow-hidden">
    <div class="flex flex-col items-center justify-center">
        <div>
            <div class="w-full max-w-[40rem] mx-auto py-20 px-8 sm:px-20" style="border-radius: 53px">
                <div class="text-center mb-8">
                    <img class="login-header-image"
                         [ngSrc]=" !layoutService.isDarkTheme()
                              ? 'assets/images/logo_light_theme.png'
                              : 'assets/images/logo_dark_theme.png'
                          "
                         width="200"
                         height="50"
                         alt="menu-logo"
                    />
                </div>

                <div *ngIf="registered" class="text-center">
                    <p class="text-surface-900 dark:text-surface-0 text-xl mb-2">
                        Your username is <strong>{{ registeredUsername }}</strong>.
                    </p>
                    <p class="text-surface-900 dark:text-surface-0 text-xl mb-8">
                        Check your email for a link to set your password.
                    </p>
                    <p-button (click)="goToLogin()" label="Back to Login" styleClass="w-full"></p-button>
                </div>

                <form *ngIf="!registered" [formGroup]="form" (submit)="submit()">
                    <div>
                        <label for="firstName"
                               class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">First Name</label>
                        <input pInputText id="firstName" type="text"
                               class="w-full md:w-[30rem] mb-8" formControlName="firstName" />
                        <small class="p-error"
                               *ngIf="validationService.hasErrors(form, 'firstName', 'required')"
                               id="firstName-input">This field is required.</small>

                        <label for="lastName"
                               class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">Last Name</label>
                        <input pInputText id="lastName" type="text"
                               class="w-full md:w-[30rem] mb-8" formControlName="lastName" />
                        <small class="p-error"
                               *ngIf="validationService.hasErrors(form, 'lastName', 'required')"
                               id="lastName-input">This field is required.</small>

                        <label for="email"
                               class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">Email</label>
                        <input pInputText id="email" type="text"
                               class="w-full md:w-[30rem] mb-8" formControlName="email" />
                        <small class="p-error"
                               *ngIf="validationService.hasErrors(form, 'email', 'required')"
                               id="email-input-required">This field is required.</small>
                        <small class="p-error"
                               *ngIf="validationService.hasErrors(form, 'email', 'email')"
                               id="email-input-email-validation">Email is not valid.</small>

                        <label for="phone"
                               class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">Phone</label>
                        <input pInputText id="phone" type="text"
                               class="w-full md:w-[30rem] mb-8" formControlName="phone" />
                        <small class="p-error"
                               *ngIf="validationService.hasErrors(form, 'phone', 'required')"
                               id="phone-input">This field is required.</small>

                        <p-button type="submit" label="Create Account" styleClass="w-full mb-4"></p-button>
                        <p-button [link]="true" (click)="goToLogin()" label="Back to Login" styleClass="w-full"></p-button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
