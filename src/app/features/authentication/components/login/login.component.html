<app-floating-configurator />
<div
    class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-[100vw] overflow-hidden">
    <div class="flex flex-col items-center justify-center">
        <div>
            <div class="w-full max-w-[40rem] mx-auto py-20 px-8 sm:px-20" style="border-radius: 53px">
                <div class="text-center mb-4">
                    <img class="login-header-image"
                         [ngSrc]=" !layoutService.isDarkTheme()
                              ? 'assets/images/logo_light_theme.png'
                              : 'assets/images/logo_dark_theme.png'
                          "
                         width="602"
                         height="262"
                         alt="menu-logo"
                    />
                </div>
                <form [formGroup]="form" (submit)="submit()">
                    <div>
                        <label for="username"
                               class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">{{ "login.username" | translate }}</label>
                        <input pInputText id="username" type="text"
                               class="w-full md:w-[30rem] mb-8" formControlName="username" />

                        <label for="password"
                               class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2">{{ "login.password" | translate }}</label>
                        <p-password id="password" formControlName="password" [toggleMask]="true"
                                    styleClass="mb-4"
                                    [fluid]="true" [feedback]="false"></p-password>

                        <div class="flex items-center justify-between mt-2 mb-8 gap-8">
                            <div class="flex items-center">
                                <p-checkbox formControlName="rememberMe" id="rememberMe" binary
                                            class="mr-2"></p-checkbox>
                                <label for="rememberMe">{{ "login.rememberMe" | translate }}</label>
                                <p-button [link]="true" (click)="openForgotPasswordDialog()" [label]="'login.forgotPassword' | translate" />
                            </div>
                        </div>
                        <div class="mb-5">

                        </div>
                        <p-button type="submit" [label]="'login.signIn' | translate" styleClass="w-full mb-4"></p-button>
                        <p-button [link]="true" routerLink="/authentication/registration" [label]="'login.createAccount' | translate" styleClass="w-full"></p-button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
