<form [formGroup]="form" (submit)="submit()">
    <div class="formgrid grid">
        <div class="field col-12 xl:col-6 lg:col-6 md:col-6">
            <label for="photos">Photos</label>
            <p-fileUpload
                name="photos"
                [multiple]="true"
                [customUpload]="true"
                [showUploadButton]="false"
                [showCancelButton]="false"
                accept="image/*"
                (onSelect)="onSelect($event)"
                (onRemove)="onRemove($event)"
            ></p-fileUpload>
            <small class="p-error"
                   *ngIf="validationService.hasErrors(form, 'photos', 'required')"
                   id="photos-input">This field is required.</small>
        </div>
        <div class="field col-12 xl:col-6 lg:col-6 md:col-6">
            <label for="name">Name</label>
            <input
                class="w-full {{validationService.getInputClass(form, 'name', 'required')}}"
                type="text" id="name" pInputText formControlName="name" />
            <small class="p-error"
                   *ngIf="validationService.hasErrors(form, 'name', 'required')"
                   id="name-input">This field is required.</small>
        </div>
        <div class="field col-12 xl:col-6 lg:col-6 md:col-6">
            <label for="description">Description</label>
            <input type="text" class="w-full {{validationService.getInputClass(form, 'description', 'required')}}"
                   id="description"
                   pInputText formControlName="description" />
            <small class="p-error"
                   *ngIf="validationService.hasErrors(form, 'description', 'required')"
                   id="description-input">This field is required.</small>
        </div>
        <div class="field col-12 xl:col-6 lg:col-6 md:col-6">
            <label for="price">Price</label>
            <p-input-number
                mode="decimal"
                suffix=" €"
                [minFractionDigits]="2"
                [maxFractionDigits]="2"
                class="w-full {{validationService.getInputClass(form, 'price', 'required')}}"
                id="price"
                formControlName="price" />
            <small class="p-error"
                   *ngIf="validationService.hasErrors(form, 'price', 'required')"
                   id="price-input">This field is required.</small>
        </div>
    </div>

    <div class="my-3">
        <p-button type="submit" iconPos="right" icon="pi pi-save" label="Save" />
    </div>
</form>
