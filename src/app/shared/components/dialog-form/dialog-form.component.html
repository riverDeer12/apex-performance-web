<div class="m-3 absolute top-0 right-0">
    <p-button (click)="cancel()" icon="pi pi-times" [text]="true"></p-button>
</div>

<app-administrator-form
        *ngIf="contentType === entityType.Administrator"
        [type]="formType"
        [dialogId]="dialogId"
        [redirectType]="redirectType"
        [administrator]="data">
</app-administrator-form>

<app-appointment-form
        *ngIf="contentType === entityType.Appointment"
        [type]="formType"
        [dialogId]="dialogId"
        [redirectType]="redirectType"
        [appointment]="data">
</app-appointment-form>

<app-appointment-type-form

</app-appointment-type-form>

</app-cancelation-request-form>

<app-change-username-form

<app-role-form
