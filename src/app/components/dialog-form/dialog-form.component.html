<div class="m-3 absolute top-0 right-0">
    <p-button (click)="cancel()" icon="pi pi-times" [text]="true"></p-button>
</div>

<app-administrator-form
    *ngIf="contentType === entityType.Administrator"
    [type]="formType"
    [dialogId]="dialogId"
    [redirectType]="redirectType"
    [administrator]="data">
</app-administrator-form>

<app-appointment-form
    *ngIf="contentType === entityType.Appointment"
    [type]="formType"
    [dialogId]="dialogId"
    [redirectType]="redirectType"
    [appointment]="data">
</app-appointment-form>

<app-client-form
    *ngIf="contentType === entityType.Client"
    [type]="formType"
    [dialogId]="dialogId"
    [redirectType]="redirectType"
    [client]="data">
</app-client-form>

<app-role-form
    *ngIf="contentType === entityType.Role"
    [type]="formType"
    [dialogId]="dialogId"
    [redirectType]="redirectType"
    [role]="data">
</app-role-form>

<app-user-form
    *ngIf="contentType === entityType.User"
    [type]="formType"
    [dialogId]="dialogId"
    [redirectType]="redirectType"
    [user]="data">
</app-user-form>
