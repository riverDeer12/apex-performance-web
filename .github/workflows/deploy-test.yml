name: Deploy to Test

on:
  push:
    branches:
      - test

concurrency:
  group: deploy-test
  cancel-in-progress: false

env:
  SITE_NAME: test.apex-performance.fit
  DEPLOY_PATH: C:\inetpub\wwwroot\apex-performance-test\wwwroot
  BUILD_OUTPUT: dist/apex-performance/browser

jobs:
  deploy:
    runs-on: [self-hosted, apex-performance]
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install

      - name: Build (test/development config)
        run: npm run development

      - name: Sync built files to IIS wwwroot
        shell: cmd
        run: >
          robocopy "${{ env.BUILD_OUTPUT }}" "${{ env.DEPLOY_PATH }}" /MIR /R:3 /W:5
          & if %ERRORLEVEL% GEQ 8 (exit /b 1) else (exit /b 0)

      - name: Health check
        shell: powershell
        run: |
          Start-Sleep -Seconds 3
          $response = Invoke-WebRequest -Uri "https://${{ env.SITE_NAME }}/" -UseBasicParsing -TimeoutSec 30
          if ($response.StatusCode -ne 200) { throw "Health check failed with status $($response.StatusCode)" }
          Write-Host "Health check passed: $($response.StatusCode)"
