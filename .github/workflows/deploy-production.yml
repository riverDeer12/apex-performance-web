name: Deploy to Production

on:
  push:
    branches:
      - production

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SITE_NAME: apex-performance.fit
  DEPLOY_PATH: C:\inetpub\wwwroot\apex-performance\wwwroot
  BUILD_OUTPUT: dist/apex-performance/browser

jobs:
  deploy:
    runs-on: [self-hosted, apex-performance]
    # This environment requires manual approval before the job runs -
    # configure a required reviewer under Settings > Environments > production
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install

      - name: Build (production config)
        run: npm run production

      - name: Sync built files to IIS wwwroot
        shell: cmd
        run: |
          robocopy "${{ env.BUILD_OUTPUT }}" "${{ env.DEPLOY_PATH }}" /MIR /R:3 /W:5
          if %ERRORLEVEL% GEQ 8 exit /b 1
          exit /b 0

      - name: Verify deployed files are fresh
        shell: powershell
        run: |
          $indexPath = Join-Path "${{ env.DEPLOY_PATH }}" "index.html"
          $age = (Get-Date) - (Get-Item $indexPath).LastWriteTime
          if ($age.TotalMinutes -gt 5) { throw "index.html was not updated by this deploy (last write $($age.TotalMinutes) minutes ago) - sync likely failed silently" }
          Write-Host "index.html is fresh (updated $([math]::Round($age.TotalSeconds))s ago)"

      - name: Health check
        shell: powershell
        run: |
          Start-Sleep -Seconds 3
          $response = Invoke-WebRequest -Uri "https://${{ env.SITE_NAME }}/" -UseBasicParsing -TimeoutSec 30
          if ($response.StatusCode -ne 200) { throw "Health check failed with status $($response.StatusCode)" }
          Write-Host "Health check passed: $($response.StatusCode)"
